tables:
  # etldoc: imposm3 -> osm_outdoor_name_polygon
  outdoor_name_polygon:
    type: polygon
    columns:
    - name: osm_id
      type: id
    - name: geometry
      type: geometry
    - name: name
      key: name
      type: string
    - name: name_en
      key: name:en
      type: string
    - name: name_de
      key: name:de
      type: string
    - name: tags
      type: hstore_tags
    - name: natural
      key: natural
      type: string
    - name: landuse
      key: landuse
      type: string
    - name: rank
      key: rank
      type: integer
    filters:
      require:
        name: ["__any__"]
    mapping:
      natural:
      - scree
      - fell
      - bare_rock
      - glacier 
      landuse:
      - meadow
  # etldoc: imposm3 -> osm_outdoor_name_linestring
  outdoor_name_linestring:
    type: linestring
    columns:
    - name: osm_id
      type: id
    - name: geometry
      type: geometry
    - name: name
      key: name
      type: string
    - name: name_en
      key: name:en
      type: string
    - name: name_de
      key: name:de
      type: string
    - name: tags
      type: hstore_tags
    - name: natural
      key: natural
      type: string
    - name: rank
      key: rank
      type: integer
    filters:
      require:
        name: ["__any__"]
    mapping:
      natural:
      - valley